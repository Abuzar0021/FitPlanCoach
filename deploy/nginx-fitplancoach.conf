# FitPlanCoach — Nginx reverse proxy (alternative to Caddy).
#
# Install as a NEW server block WITHOUT touching OmniStack's config:
#   sudo cp deploy/nginx-fitplancoach.conf /etc/nginx/sites-available/fitplancoach.conf
#   sudo ln -s /etc/nginx/sites-available/fitplancoach.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx     # reload is graceful — OmniStack stays up
#
# Then issue HTTPS without stopping Nginx (uses the running server):
#   sudo certbot --nginx -d fitplancoach.com -d www.fitplancoach.com
# Certbot rewrites this file to add the TLS listener + redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name fitplancoach.com www.fitplancoach.com;

    # Proxy to the loopback-published container (HOST_PORT in .env.docker).
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Static assets can be cached aggressively (hashed filenames).
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
